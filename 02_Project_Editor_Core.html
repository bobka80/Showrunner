<script>
/**
 * 02_Project_Editor_Core.html
 * Domain: Project Editor, Settings, and Mini-Calendar Editor.
 */

window.isProjectDirty = false;

// ==========================================
// --- PRESENCE ENGINE (UI HEARTBEAT) ---
// ==========================================
// @INDEX: PRESENCE -> Presence Engine & Heartbeat
let presenceTimer = null;
let activePresenceProject = null;
window.activePresenceModule = 'main'; // Tracks if user is in 'main', 'timeline', etc.
window.activePresencePaMode = '';     // design | packing | operation (when module === assets)
window.isTimelineOccupiedBy = null;   // Legacy: first other user in timeline (informational only — no door lock)
window.timelineOccupants = [];        // Other users currently in timeline module
window.paPrepOccupants = [];          // Other users in assets module during prep [{name, mode}]
window.peForkPrepActive_ = false;     // Project editor chrome: prep fork on Firebase
window.peForkTimelineActive_ = false; // Project editor chrome: timeline fork on Firebase
window.peForkRoomActive_ = false;     // Campaign Room R1: warm room on Index / meta
window.peCampaignRoomJoinFor_ = '';   // Latch — open/join room once per editor entry
window.peCheckpointLastPub_ = '';     // R4 — last successful Sheets publish ISO
window.peCheckpointFailAt_ = '';
window.peCheckpointEscalate_ = false;
window.peCheckpointBusy_ = false;
window.peCheckpointTimer_ = null;
window.peWarmAutosaveTimer_ = null;   // W5 — debounced warm identity/offer save
window.peWarmAutosaveBusy_ = false;
window.peWarmAutosavePending_ = false;
window.peMiniCalDragging_ = false;
window.peMiniCalPaintReady_ = false;
window.peAutosaveCueState_ = '';      // '' | saving | saved | error
window.peLeaveSavePayload_ = null;    // Cancel leave — send after in-flight settles
window.peLeaveSaveQuiet_ = false;
window.peLeaveSaveRetried_ = false;

/** Paint OPEN TIMELINE / PROJECT ASSETS / END ROOM chrome from fork + presence flags (never disables click). */
window.paintProjectEditorModuleBtns_ = function() {
  var tlBtn = document.getElementById('master-timeline-btn');
  var paBtn = document.getElementById('master-assets-btn');
  var endRoomBtn = document.getElementById('master-end-room-btn');
  var cue = document.getElementById('master-checkpoint-cue');
  var occupants = window.timelineOccupants || [];
  var tlFork = !!window.peForkTimelineActive_;
  var paFork = !!window.peForkPrepActive_;
  var roomWarm = !!window.peForkRoomActive_;
  var roomInset = roomWarm ? 'inset 3px 0 0 #22c55e' : '';

  if (tlBtn) {
    tlBtn.disabled = false;
    tlBtn.style.borderColor = '';
    tlBtn.style.color = '';
    tlBtn.style.boxShadow = roomInset;
    if (occupants.length > 0) {
      var n = occupants.length;
      tlBtn.innerText = n === 1
        ? ('👥 ' + String(occupants[0]).toUpperCase() + ' IN TIMELINE')
        : ('👥 ' + n + ' IN TIMELINE');
      tlBtn.className = 'btn-outline btn-outline-blue';
      tlBtn.title = 'Open timeline — others already inside: ' + occupants.join(', ') +
        (roomWarm ? ' · Campaign room warm' : '');
    } else if (tlFork) {
      tlBtn.innerText = 'OPEN TIMELINE';
      tlBtn.className = 'btn-outline btn-outline-blue';
      tlBtn.title = 'Timeline fork is on Firebase' + (roomWarm ? ' · Campaign room warm' : '');
    } else {
      tlBtn.innerText = 'OPEN TIMELINE';
      tlBtn.className = 'btn-outline';
      tlBtn.title = roomWarm ? 'Campaign room warm' : '';
    }
  }

  if (paBtn) {
    paBtn.disabled = false;
    paBtn.style.borderColor = '';
    paBtn.style.color = '';
    paBtn.style.boxShadow = roomInset;
    if (paFork) {
      paBtn.className = 'btn-outline btn-outline-orange';
      paBtn.title = 'Project Assets fork is on Firebase' + (roomWarm ? ' · Campaign room warm' : '');
    } else {
      paBtn.className = 'btn-outline';
      paBtn.title = roomWarm ? 'Campaign room warm' : '';
    }
  }

  if (endRoomBtn) {
    endRoomBtn.style.display = roomWarm ? 'inline-flex' : 'none';
    endRoomBtn.disabled = !!window.dalCampaignRoomClosing_;
  }

  if (typeof window.paintCampaignCheckpointCue_ === 'function') {
    window.paintCampaignCheckpointCue_();
  } else if (cue) {
    cue.style.display = roomWarm ? 'inline-flex' : 'none';
  }

  if (typeof window.dalPaintCampaignEndBtnLabels_ === 'function') {
    window.dalPaintCampaignEndBtnLabels_();
  }
  if (typeof window.peSyncSaveBtnChrome_ === 'function') {
    window.peSyncSaveBtnChrome_();
  }
};

window.paintCampaignCheckpointCue_ = function() {
  var cue = document.getElementById('master-checkpoint-cue');
  if (!cue) return;
  var roomWarm = !!window.peForkRoomActive_;
  if (!roomWarm) {
    cue.style.display = 'none';
    cue.textContent = '';
    cue.classList.remove('is-fail', 'is-busy');
    cue.disabled = false;
    return;
  }
  cue.style.display = 'inline-flex';
  var fmt_ = function(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    } catch (e) { return ''; }
  };
  if (window.peCheckpointBusy_) {
    cue.classList.remove('is-fail');
    cue.classList.add('is-busy');
    cue.disabled = true;
    cue.textContent = 'publishing…';
    cue.title = 'Publishing to Sheets — room stays open';
    return;
  }
  cue.classList.remove('is-busy');
  cue.disabled = false;
  if (window.peCheckpointEscalate_ || window.peCheckpointFailAt_) {
    cue.classList.add('is-fail');
    var failT = fmt_(window.peCheckpointFailAt_);
    cue.textContent = failT ? (failT + ' retry') : 'retry publish';
    cue.title = 'Sheets publish failed or lagging. Click to retry now (room stays open).';
  } else if (window.peCheckpointLastPub_) {
    cue.classList.remove('is-fail');
    cue.textContent = (fmt_(window.peCheckpointLastPub_) || '…') + ' publish';
    cue.title = 'Click to publish Sheets now (room stays open)';
  } else {
    cue.classList.remove('is-fail');
    cue.textContent = '… publish';
    cue.title = 'Click to publish Sheets now (room stays open)';
  }
};

window.applyCampaignCheckpointResult_ = function(res) {
  if (!res) return;
  if (res.lastPublishedAt) window.peCheckpointLastPub_ = String(res.lastPublishedAt);
  window.peCheckpointFailAt_ = res.checkpointFailAt ? String(res.checkpointFailAt) : '';
  window.peCheckpointEscalate_ = !!res.escalate || (res.success === false && !res.skipped);
  // Checkpoint / meta publish bumps Index Last_Updated — keep editor version in sync
  // so Save & Sync does not false-collide with "another user".
  if (res.indexLastUpdated || (res.success && res.lastPublishedAt && !res.skipped)) {
    var verEl = document.getElementById('edit-proj-version');
    if (verEl) {
      verEl.value = String(res.indexLastUpdated || res.lastPublishedAt || verEl.value);
    }
  }
  if (res.roomLive === true) {
    window.peForkRoomActive_ = true;
  }
  if (typeof window.paintCampaignCheckpointCue_ === 'function') {
    window.paintCampaignCheckpointCue_();
  }
  if (typeof window.paintProjectEditorModuleBtns_ === 'function') {
    window.paintProjectEditorModuleBtns_();
  }
};

window.runDalCampaignCheckpointNow_ = function(opts) {
  opts = opts || {};
  var projectId = (document.getElementById('edit-folder-id')
    ? document.getElementById('edit-folder-id').value : '') ||
    (typeof window.dalPresenceProjectId_ === 'function' && window.dalPresenceProjectId_()) || '';
  if (!projectId || projectId === 'NEW') return;
  if (!window.peForkRoomActive_) return;
  if (window.peCheckpointBusy_ || window.dalCampaignRoomClosing_) return;
  if (typeof google === 'undefined' || !google.script || !google.script.run) return;
  window.peCheckpointBusy_ = true;
  if (typeof window.paintCampaignCheckpointCue_ === 'function') {
    window.paintCampaignCheckpointCue_();
  }
  var actor = (typeof ACTIVE_USER_NAME !== 'undefined' && ACTIVE_USER_NAME)
    ? String(ACTIVE_USER_NAME) : 'System';
  google.script.run
    .withFailureHandler(function(err) {
      window.peCheckpointBusy_ = false;
      window.peCheckpointFailAt_ = new Date().toISOString();
      window.peCheckpointEscalate_ = true;
      if (typeof window.paintCampaignCheckpointCue_ === 'function') {
        window.paintCampaignCheckpointCue_();
      }
      if (opts.force) {
        var msg = (err && err.message) ? String(err.message) : String(err || 'Unknown error');
        try { alert('Checkpoint failed:\n\n' + msg); } catch (eA) { /* ignore */ }
      }
    })
    .withSuccessHandler(function(res) {
      window.peCheckpointBusy_ = false;
      if (typeof window.applyCampaignCheckpointResult_ === 'function') {
        window.applyCampaignCheckpointResult_(res);
      }
      if (opts.force && res && res.success === false && !res.skipped) {
        try {
          alert('Checkpoint failed on ' + (res.failedSlice || 'slice') + ':\n\n' +
            String(res.error || 'Unknown error') +
            '\n\nRoom stayed open — live data is still on Firebase.');
        } catch (eA2) { /* ignore */ }
      }
      // Re-read Index for room chrome — do not clobber a newer cue stamp (see refresh).
      if (res && res.success && !res.skipped &&
          typeof window.refreshProjectEditorForkChrome_ === 'function') {
        try { window.refreshProjectEditorForkChrome_(projectId); } catch (eR) { /* ignore */ }
      }
    })
    .runDalCampaignCheckpoint(projectId, actor, opts);
};

window.startDalCampaignCheckpointTimer_ = function() {
  if (window.peCheckpointTimer_) return;
  window.peCheckpointTick_ = 0;
  window.peCheckpointTimer_ = setInterval(function() {
    if (!window.peForkRoomActive_) return;
    if (window.dalCampaignRoomClosing_) return;
    if (typeof window.runDalCampaignCheckpointNow_ === 'function') {
      window.runDalCampaignCheckpointNow_({});
    }
    // R5: ~every 15m while in editor, ask server if this room went idle.
    window.peCheckpointTick_ = (window.peCheckpointTick_ || 0) + 1;
    if (window.peCheckpointTick_ % 15 === 0 && typeof window.runDalCampaignIdleCheckNow_ === 'function') {
      window.runDalCampaignIdleCheckNow_();
    }
  }, 60000);
};

window.runDalCampaignIdleCheckNow_ = function() {
  var projectId = (document.getElementById('edit-folder-id')
    ? document.getElementById('edit-folder-id').value : '') || '';
  if (!projectId || projectId === 'NEW' || !window.peForkRoomActive_) return;
  if (typeof google === 'undefined' || !google.script || !google.script.run) return;
  var actor = (typeof ACTIVE_USER_NAME !== 'undefined' && ACTIVE_USER_NAME)
    ? String(ACTIVE_USER_NAME) : 'System';
  google.script.run
    .withFailureHandler(function() { /* ignore */ })
    .withSuccessHandler(function(res) {
      if (!res || !(res.closed || []).length) return;
      window.peForkRoomActive_ = false;
      if (typeof window.stopDalCampaignCheckpointTimer_ === 'function') {
        try { window.stopDalCampaignCheckpointTimer_(); } catch (e0) { /* ignore */ }
      }
      if (typeof window.dalDetachCampaignLiveListeners_ === 'function') {
        try { window.dalDetachCampaignLiveListeners_({ clearChrome: true }); } catch (e1) { /* ignore */ }
      }
      if (typeof window.paintProjectEditorModuleBtns_ === 'function') {
        window.paintProjectEditorModuleBtns_();
      }
      try {
        if (typeof showToast === 'function') {
          showToast('Campaign room closed after idle — next open rewarms from Sheets.');
        }
      } catch (eT) { /* ignore */ }
    })
    .runDalCampaignIdleSweep(actor, { projectId: projectId });
};

/** Coalesced client → GAS activity stamp (PA/timeline direct Firestore writes). */
window.dalTouchCampaignActivityClient_ = function(projectId) {
  projectId = projectId || (document.getElementById('edit-folder-id')
    ? document.getElementById('edit-folder-id').value : '');
  if (!projectId || projectId === 'NEW') return;
  if (!window.peForkRoomActive_ && !(typeof window.dalCampaignRoomIsWarm_ === 'function' &&
      window.dalCampaignRoomIsWarm_())) return;
  var now = Date.now();
  if (window.dalCampaignActivityClientAt_ &&
      (now - window.dalCampaignActivityClientAt_) < 60000) return;
  window.dalCampaignActivityClientAt_ = now;
  if (typeof google === 'undefined' || !google.script || !google.script.run) return;

function startPresencePing(projectId) {
    stopPresencePing();
    if (!projectId || projectId === 'NEW') return;
    activePresenceProject = projectId;

    // Clickable immediately — presence + fork chrome refresh in background.
    window.timelineOccupants = [];
    window.isTimelineOccupiedBy = null;
    window.paPrepOccupants = [];
    window.peForkPrepActive_ = false;
    window.peForkTimelineActive_ = false;
    window.peForkRoomActive_ = false;
    if (typeof window.paintProjectEditorModuleBtns_ === 'function') window.paintProjectEditorModuleBtns_();
    if (typeof window.openOrJoinDalCampaignRoom_ === 'function') {
      window.openOrJoinDalCampaignRoom_(projectId);
    }
    if (typeof window.refreshProjectEditorForkChrome_ === 'function') {
      window.refreshProjectEditorForkChrome_(projectId);
    }

    const ping = () => {
        if (!activePresenceProject) return;
        let userAlias = typeof ACTIVE_USER_NAME !== 'undefined' ? ACTIVE_USER_NAME : 'Unknown';
        if (typeof window.dalPaSyncPresencePaMode_ === 'function') window.dalPaSyncPresencePaMode_();
        if (typeof window.refreshProjectEditorForkChrome_ === 'function') {
          window.refreshProjectEditorForkChrome_(activePresenceProject);
        }
        google.script.run
        .withFailureHandler(function() {
            // Keep last known chrome; never leave the button disabled.
            if (typeof window.paintProjectEditorModuleBtns_ === 'function') window.paintProjectEditorModuleBtns_();
        })
        .withSuccessHandler(othersObj => {
            // null = presence lock miss — keep last known roster (do not pretend room emptied).
            if (othersObj == null) {
              if (typeof window.paintProjectEditorModuleBtns_ === 'function') window.paintProjectEditorModuleBtns_();
              return;
            }
            window.isTimelineOccupiedBy = null;
            window.timelineOccupants = [];
            window.paPrepOccupants = [];
            othersObj = othersObj || {};
            for (let name in othersObj) {
                if (!othersObj[name]) continue;
                if (othersObj[name].module === 'timeline') {
                    window.timelineOccupants.push(name);
                    if (!window.isTimelineOccupiedBy) window.isTimelineOccupiedBy = name;
                }
                if (othersObj[name].module === 'assets') {
                    window.paPrepOccupants.push({
                        name: name,
                        mode: othersObj[name].subMode || 'design'
                    });
                }
            }

            // Presence is informational only — never blocks opening (timeline collab).
            if (typeof window.paintProjectEditorModuleBtns_ === 'function') window.paintProjectEditorModuleBtns_();
            if (typeof window.dalUpdateRemotePendingBanner_ === 'function') window.dalUpdateRemotePendingBanner_();
            if (typeof window.dalUpdateTimelineLiveBanner_ === 'function') window.dalUpdateTimelineLiveBanner_();
            // Part B4 — peers in the live room reset idle (room not empty).
            if (window.dalPrepUiOpen && (window.paPrepOccupants || []).length > 0 &&
                typeof window.dalTouchRoomIdle_ === 'function') {
              window.dalTouchRoomIdle_('prep');
            }
            if (window.dalTimelineSessionOpen && (window.timelineOccupants || []).length > 0 &&
                typeof window.dalTouchRoomIdle_ === 'function') {
              window.dalTouchRoomIdle_('timeline');
            }
            // Empty live module + fork still open → commit (covers refresh/crash orphans).
            if (typeof window.dalMaybeReclaimEmptyLiveForks_ === 'function') {
              window.dalMaybeReclaimEmptyLiveForks_(othersObj);
            }
        }).reportProjectPresence(
          activePresenceProject,
          userAlias,
          'ping',
          window.activePresenceModule,
          (function() {
            var sub = window.activePresencePaMode || '';
            if (window.IS_STATION_DEVICE) {
              sub = sub ? (sub + '|station') : 'station';
            }
            return sub;
          })()
        );
    };
    
    ping(); 
    var pingMs = (typeof window.DAL_PRESENCE_PING_MS_ === 'number' && window.DAL_PRESENCE_PING_MS_ > 0)
      ? window.DAL_PRESENCE_PING_MS_
      : 45000;
    presenceTimer = setInterval(ping, pingMs); 
}

/** Build timeline fragments from main-calendar rawDbData when mini-cal paint is empty. */
window.peTimelinesFromRawFragments_ = function(projectId) {
  var out = [];
  if (!projectId || projectId === 'NEW' || typeof calendar === 'undefined' || !calendar) return out;
  try {
    var projectEvent = calendar.getEventById(projectId);
    if (!projectEvent) {
      projectEvent = calendar.getEvents().find(function(e) {
        return e.id === projectId ||
          (e.extendedProps && e.extendedProps.rawDbData &&
            String(e.extendedProps.rawDbData.id) === String(projectId));
      });
    }
    var raw = projectEvent && projectEvent.extendedProps && projectEvent.extendedProps.rawDbData;
    var frags = raw && raw.fragments;
    if (!frags || !frags.length) return out;
    frags.forEach(function(f) {
      if (!f || !f.date) return;
      out.push({
        uid: f.uid || '',
        Sub_Event_Type: f.type || 'MAIN_EVENT',
        Event_Date: f.date,
        Start_Time: f.startTime || '',
        End_Time: f.endTime || '',
        Note: f.note || ''
      });
    });
  } catch (eRaw) { /* empty */ }
  return out;
};

/** Gather the same payload as explicit Save & Sync. Returns null if not saveable. */
window.peGatherIdentitySavePayload_ = function() {
  var folderEl = document.getElementById('edit-folder-id');
  var id = folderEl ? folderEl.value : '';
  var nameEl = document.getElementById('edit-proj-name');
  var newT = nameEl ? String(nameEl.value || '').trim() : '';
  if (!newT) return null;

  var activeState = window.currentReadinessState || {};
  var outdoorEl = document.getElementById('edit-proj-outdoor');
  var sofiaEl = document.getElementById('edit-proj-in-sofia');
  var zoneEl = document.getElementById('edit-proj-region-zone');
  var distEl = document.getElementById('edit-proj-distance');
  var latEl = document.getElementById('edit-proj-lat');
  var lngEl = document.getElementById('edit-proj-lng');
  if (outdoorEl) activeState.isOutdoor = outdoorEl.checked;
  if (sofiaEl) activeState.inSofia = sofiaEl.checked;
  activeState.regionZone = zoneEl ? zoneEl.value : (activeState.inSofia ? 'sofia' : 'outside_sofia');
  activeState.distanceKm = distEl ? (parseFloat(distEl.value) || 0) : 0;
  var lat = latEl ? latEl.value : '';
  var lng = lngEl ? lngEl.value : '';
  if (lat && lng) activeState.coords = { lat: lat, lng: lng };
  window.currentReadinessState = activeState;

  var statusEl = document.getElementById('display-event-status');
  var typeEl = document.getElementById('edit-proj-type');
  var clientEl = document.getElementById('edit-proj-client');
  var locEl = document.getElementById('edit-proj-location');
  var verEl = document.getElementById('edit-proj-version');
  var multEl = document.getElementById('edit-proj-multiplier');

  var projectData = {
    Project_ID: (id === 'NEW') ? '' : id,
    Project_Name: newT,
    Status: statusEl ? statusEl.innerText : 'Draft',
    Type: typeEl ? typeEl.value : 'Event',
    Client: clientEl ? clientEl.value : '',
    Location_URL: locEl ? locEl.value : '',
    Last_Updated: verEl ? verEl.value : '',
    Difficulty_Multiplier: multEl ? parseFloat(multEl.value) : 1.0,
    Readiness_State: JSON.stringify(activeState),
    _gatheredAt: new Date().toISOString()
  };

  var timelines = [];
  var phaseMap = { wh: 'WAREHOUSE', main: 'MAIN_EVENT', show: 'SHOW_DAY', recovery: 'RECOVERY', transit: 'TRANSIT' };
  var paintedEvents = (typeof miniCalendar !== 'undefined' && miniCalendar)
    ? miniCalendar.getEvents()
    : [];
  if (paintedEvents && paintedEvents.length) {
    paintedEvents.forEach(function(ev) {
      var phaseCode = ev.extendedProps.phaseType;
      var note = ev.extendedProps.note || '';
      var sTime = ev.extendedProps.startTime || '';
      var eTime = ev.extendedProps.endTime || '';
      var backendType = phaseMap[phaseCode] || phaseCode;
      if (!backendType) return;
      var startD = ev.start;
      var endD = ev.end ? ev.end : new Date(startD.getTime() + 86400000);
      if (endD <= startD) endD = new Date(startD.getTime() + 86400000);
      var currentD = new Date(startD);
      while (currentD < endD) {
        var isoDay = currentD.getFullYear() + '-' +
          String(currentD.getMonth() + 1).padStart(2, '0') + '-' +
          String(currentD.getDate()).padStart(2, '0');
        timelines.push({
          uid: (ev.extendedProps.uidsByDate && ev.extendedProps.uidsByDate[isoDay]) || ev.extendedProps.uid || '',
          Sub_Event_Type: backendType,
          Event_Date: isoDay,
          Start_Time: sTime,
          End_Time: eTime,
          Note: note
        });
        currentD.setDate(currentD.getDate() + 1);
      }
    });
  }
  // Only before mini-cal unpack finishes — never after user cleared all phases (would restore stale raw).
  if (!timelines.length && id && id !== 'NEW' && !window.peMiniCalPaintReady_) {
    timelines = window.peTimelinesFromRawFragments_(id);
  }
  // NEW create still requires painted phases; saved projects need at least one fragment.
  if (!timelines.length) return null;

  return { projectData: projectData, timelines: timelines, id: id, newT: newT };
};

/**
 * Reopen reads FullCalendar rawDbData (not a live server fetch). After identity
 * autosave / leave flush, patch that cache so Cancel → re-open shows the new values.
 * Updates rollup + every phase-fragment event that shares this project id.
 */
window.pePatchLocalCalendarAfterIdentitySave_ = function(payload, timestamp) {
  if (!payload || !payload.projectData) return;
  var pd = payload.projectData;
  var id = String(pd.Project_ID || '');
  if (!id || id === 'NEW') return;
  if (typeof calendar === 'undefined' || !calendar || typeof calendar.getEvents !== 'function') return;
  try {
    var seedEv = calendar.getEventById(id);
    if (!seedEv) {
      seedEv = calendar.getEvents().find(function(e) {
        var r = e && e.extendedProps && e.extendedProps.rawDbData;
        return r && String(r.id) === id;
      });
    }
    var raw = (seedEv && seedEv.extendedProps && seedEv.extendedProps.rawDbData) || {};
    var next = {};
    for (var k in raw) {
      if (Object.prototype.hasOwnProperty.call(raw, k)) next[k] = raw[k];
    }
    next.id = next.id || id;

    if (pd.Project_Name) {
      next.title = pd.Project_Name;
      next.fullTitle = pd.Project_Name;
    }
    if (pd.Client !== undefined) next.client = pd.Client;
    if (pd.Status) next.status = pd.Status;
    if (pd.Type) next.type = pd.Type;
    if (pd.Location_URL !== undefined) next.locationUrl = pd.Location_URL;
    if (pd.Difficulty_Multiplier !== undefined && pd.Difficulty_Multiplier !== '') {
      next.difficultyMultiplier = parseFloat(pd.Difficulty_Multiplier) || 1;
    }
    if (timestamp) next.lastUpdated = timestamp;

    if (pd.Readiness_State) {
      try {
        next.readinessState = (typeof pd.Readiness_State === 'string')
          ? JSON.parse(pd.Readiness_State)
          : pd.Readiness_State;
      } catch (eR) { /* keep prior readiness */ }
    }

    if (payload.timelines && payload.timelines.length) {
      next.fragments = payload.timelines.map(function(t) {
        return {
          uid: t.uid || '',
          type: t.Sub_Event_Type || 'MAIN_EVENT',
          date: t.Event_Date || '',
          startTime: t.Start_Time || '',
          endTime: t.End_Time || '',
          note: t.Note || ''
        };
      });
      var start = null;
      var end = null;
      next.fragments.forEach(function(f) {
        if (!f.date) return;
        if (!start || f.date < start) start = f.date;
        if (!end || f.date > end) end = f.date;
      });
      if (start) next.start = start;
      if (end) next.end = end;
    }

    calendar.getEvents().forEach(function(e) {
      if (!e || !e.extendedProps) return;
      var r = e.extendedProps.rawDbData;
      if (!r) return;
      if (String(r.id || '') !== id && String(e.id || '') !== id) return;
      e.setExtendedProp('rawDbData', next);
      if (pd.Project_Name) {
        try { e.setExtendedProp('fullTitle', pd.Project_Name); } catch (eF) { /* ignore */ }
      }
      if (pd.Status) {
        try { e.setExtendedProp('status', pd.Status); } catch (eS) { /* ignore */ }
      }
      if (e.extendedProps.isRollup && pd.Project_Name) {
        try { e.setProp('title', pd.Project_Name); } catch (eT) { /* ignore */ }
      }
    });

    // Keep rollup bar span in sync with new fragment range (FC all-day end is exclusive).
    var rollup = calendar.getEventById(id);
    if (rollup && next.start) {
      try {
        rollup.setStart(next.start);
        if (next.end) {
          var endExclusive = new Date(next.end + 'T00:00:00');
          endExclusive.setDate(endExclusive.getDate() + 1);
          var y = endExclusive.getFullYear();
          var m = String(endExclusive.getMonth() + 1).padStart(2, '0');
          var d = String(endExclusive.getDate()).padStart(2, '0');
          rollup.setEnd(y + '-' + m + '-' + d);
        }
      } catch (eSpan) { /* non-fatal */ }
    }
  } catch (ePatch) { /* non-fatal */ }
};

window.peScheduleWarmIdentityAutosave_ = function() {

  }

    window.peFlushWarmIdentityAutosave_();
  }, 800);
};

/** Send identity payload; queue behind in-flight. opts.quiet = Cancel leave (no alerts). */
window.peSendIdentitySavePayload_ = function(payload, opts) {
  opts = opts || {};
  var quiet = !!opts.quiet;
  if (!payload || !payload.projectData) return;
  if (window.peWarmAutosaveBusy_) {
    if (quiet) {
      window.peLeaveSavePayload_ = payload;
      window.peLeaveSaveQuiet_ = true;
    } else {
      window.peWarmAutosavePending_ = true;
    }
    return;
  }
  if (typeof window.guardDatabaseBackupLock === 'function' &&
      window.guardDatabaseBackupLock(quiet ? 'project leave save' : 'project autosave')) {
    window.peWarmAutosavePending_ = true;
    if (!quiet) window.peScheduleWarmIdentityAutosave_();
    return;
  }

  window.peWarmAutosaveBusy_ = true;
  window.peWarmAutosavePending_ = false;
  if (!quiet) {
    window.peLeaveSaveQuiet_ = false;
    window.pePaintAutosaveCue_('saving');
  }

  var actor = (typeof ACTIVE_USER_NAME !== 'undefined' && ACTIVE_USER_NAME)
    ? ACTIVE_USER_NAME
    : 'System UI';
  var sent = payload;

  var finishFail_ = function(err) {
    window.peWarmAutosaveBusy_ = false;
    var msg = (err && err.message) ? err.message : String(err || 'Save failed');
    var isCollision = /COLLISION_DETECTED/i.test(msg);
    if (quiet || window.peLeaveSaveQuiet_) {
      // Do NOT bump Last_Updated and resend on collision — that would overwrite a peer.
      if (!isCollision && !window.peLeaveSaveRetried_ && sent && sent.projectData) {
        window.peLeaveSaveRetried_ = true;
        sent.projectData.Last_Updated = new Date().toISOString();
        window.peSendIdentitySavePayload_(sent, { quiet: true });
        return;
      }
      window.peLeaveSaveQuiet_ = false;
      if (!isCollision && window.peLeaveSavePayload_) {
        var leaveFail = window.peLeaveSavePayload_;
        window.peLeaveSavePayload_ = null;
        window.peLeaveSaveRetried_ = false;
        window.peSendIdentitySavePayload_(leaveFail, { quiet: true });
      } else {
        window.peLeaveSavePayload_ = null;
        window.peLeaveSaveRetried_ = false;
      }
      return;
    }
    window.pePaintAutosaveCue_('error', isCollision ? 'Refresh needed' : 'Save failed');
    if (typeof showToast === 'function') showToast('Autosave failed: ' + msg);
    else alert('Autosave failed: ' + msg);
    window.peSyncSaveBtnChrome_();
    if (window.peLeaveSavePayload_) {
      var leave = window.peLeaveSavePayload_;
      window.peLeaveSavePayload_ = null;
      window.peLeaveSaveRetried_ = false;
      window.peSendIdentitySavePayload_(leave, { quiet: true });
    }
  };

  var finishOk_ = function(res) {
    window.peWarmAutosaveBusy_ = false;
    if (res && res.toString && res.toString().startsWith('Error')) {
      finishFail_(new Error(String(res)));
      return;
    }
    var resObj = { id: res };
    try {
      if (typeof res === 'string' && res.charAt(0) === '{') resObj = JSON.parse(res);
      else if (res && typeof res === 'object') resObj = res;
    } catch (eP) { /* keep */ }
    if (resObj.timestamp) {
      var verEl = document.getElementById('edit-proj-version');
      if (verEl) verEl.value = resObj.timestamp;
      if (window.peLeaveSavePayload_ && window.peLeaveSavePayload_.projectData) {
        window.peLeaveSavePayload_.projectData.Last_Updated = resObj.timestamp;
      }
    }
    if (typeof window.pePatchLocalCalendarAfterIdentitySave_ === 'function') {
      window.pePatchLocalCalendarAfterIdentitySave_(sent, resObj.timestamp || '');
    }
    // Clear dirty on any successful identity write (quiet leave/nav included).
    window.isProjectDirty = false;
    if (!quiet) {
      window.pePaintAutosaveCue_('saved');
      window.peSyncSaveBtnChrome_();
    }
    window.peLeaveSaveQuiet_ = false;
    if (window.peLeaveSavePayload_) {
      var leave2 = window.peLeaveSavePayload_;
      window.peLeaveSavePayload_ = null;
      window.peLeaveSaveRetried_ = false;
      window.peSendIdentitySavePayload_(leave2, { quiet: true });
      return;
    }
    if (window.peWarmAutosavePending_) {
      window.peScheduleWarmIdentityAutosave_();
    } else if (!quiet) {
      setTimeout(function() {
        if (window.peAutosaveCueState_ === 'saved') window.pePaintAutosaveCue_('');
      }, 2500);
    }
  };

  var useLive = !!(typeof window.peIsWarmEditorAutosave_ === 'function' &&
    window.peIsWarmEditorAutosave_() &&
    typeof window.dalWriteWarmIdentityLive_ === 'function' &&
    !opts.forceGas);

  if (useLive) {
    window.dalWriteWarmIdentityLive_(payload, function(liveErr, liveRes) {
      if (liveErr) {
        var liveMsg = (liveErr && liveErr.message) ? liveErr.message : String(liveErr || '');
        // Collision is authoritative — do not re-fight via GAS with the same stamp.
        if (/COLLISION_DETECTED/i.test(liveMsg)) {
          finishFail_(liveErr);
          return;
        }
        // Fall back to GAS warm path once if live wire fails (rules/auth/host).
        try { console.warn('[PE] identity live write failed; falling back to GAS', liveErr); } catch (eW) { /* ignore */ }
        google.script.run
          .withFailureHandler(finishFail_)
          .withSuccessHandler(finishOk_)
          .saveEventFromUI(payload.projectData, payload.timelines, actor);
        return;
      }
      finishOk_(liveRes || {});
    });
    return;
  }

  google.script.run
    .withFailureHandler(finishFail_)
    .withSuccessHandler(finishOk_)
    .saveEventFromUI(payload.projectData, payload.timelines, actor);
};

window.peFlushWarmIdentityAutosave_ = function(opts) {
  opts = opts || {};
  if (!window.peCanIdentityAutosave_ || !window.peCanIdentityAutosave_()) return;
  if (window.peMiniCalDragging_ && !opts.force) {
    window.peScheduleWarmIdentityAutosave_();
    return;
  }
  if (window.peWarmAutosaveBusy_) {
    if (opts.quiet) {
      var leavePayload = window.peGatherIdentitySavePayload_();
      if (leavePayload) {
        window.peLeaveSavePayload_ = leavePayload;
        window.peLeaveSaveQuiet_ = true;
      }
    } else {
      window.peWarmAutosavePending_ = true;
    }
    return;
  }
  if (!window.isProjectDirty && !window.peWarmAutosavePending_ && !opts.force) return;

  var payload = window.peGatherIdentitySavePayload_();
  if (!payload) {
    // Mini-cal may still be unpacking — retry once shortly; don't leave pending stuck forever.
    if (!opts._gatherRetry) {
      window.peWarmAutosavePending_ = true;
      setTimeout(function() {
        window.peFlushWarmIdentityAutosave_({ force: !!opts.force, quiet: !!opts.quiet, _gatherRetry: true });
      }, 1200);
    } else {
      window.peWarmAutosavePending_ = false;
      if (!opts.quiet) window.pePaintAutosaveCue_('error', 'Save waiting on calendar');
    }
    return;
  }
  window.peSendIdentitySavePayload_(payload, { quiet: !!opts.quiet });
};

/**
 * Quiet gather+flush for Cancel / open PA / Timeline / Logistics post-save.
 * Returns true when autosave handled dirty (caller may proceed without runSchedule).
 * Returns false when caller should use the legacy confirm + runSchedule path (NEW / briefing).
 */
window.peQuietFlushIdentityForNav_ = function() {
  if (!window.peCanIdentityAutosave_ || !window.peCanIdentityAutosave_()) return false;
  if (!(window.isProjectDirty || window.peWarmAutosavePending_ || window.peWarmAutosaveBusy_)) return true;
  if (window.peWarmAutosaveTimer_) {
    try { clearTimeout(window.peWarmAutosaveTimer_); } catch (eT) { /* ignore */ }
    window.peWarmAutosaveTimer_ = null;
  }
  var payload = null;
  try { payload = window.peGatherIdentitySavePayload_(); } catch (eG) { payload = null; }
  window.isProjectDirty = false;
  window.peWarmAutosavePending_ = false;
  window.peLeaveSaveRetried_ = false;
  if (payload && typeof window.peSendIdentitySavePayload_ === 'function') {
    window.peLeaveSaveQuiet_ = true;
    window.peSendIdentitySavePayload_(payload, { quiet: true });
  } else {
    window.peLeaveSaveQuiet_ = false;
  }
  return true;
};

// @INDEX: PROJECT_CRUD -> Schedule Save & Sync
function runSchedule() {
    const folderId = document.getElementById('edit-folder-id').value;
    if (typeof isBriefingMode === 'function' && isBriefingMode(folderId)) {
        return alert('🛑 Read-only briefing view — you cannot save project changes.');
    }
    if (typeof canCreateOnCalendar === 'function' && folderId === 'NEW' && !canCreateOnCalendar()) {
        return alert('🛑 Permission Denied: You cannot create new events.');
    }
    if (window.peIsWarmEditorAutosave_ && window.peIsWarmEditorAutosave_()) {
        window.isProjectDirty = true;
        window.peFlushWarmIdentityAutosave_({ force: true });
        return;
    }
    const btn = document.getElementById('update-btn'); 
    const id = folderId; 
    const gathered = window.peGatherIdentitySavePayload_();
    if (!gathered) {
        if (!document.getElementById('edit-proj-name').value) return alert("⚠️ A Project Title is required!");
        if (!miniCalendar) return alert("⚠️ The Calendar Engine is offline.");
        return alert("⚠️ You must paint at least one phase on the calendar before saving!");
    }
    const newT = gathered.newT;
    const projectData = gathered.projectData;
    const timelines = gathered.timelines;

    if (window.guardDatabaseBackupLock && window.guardDatabaseBackupLock('project save')) return;

    btn.disabled = true; 
    btn.innerText = "SAVING...";
    
    let safetyTimer = setTimeout(() => {
        btn.disabled = false; 
        btn.innerText = "SAVE & SYNC CALENDAR"; 
        alert("Network Timeout: The server took too long to respond. Please check your connection.");
    }, 20000);
    
    google.script.run
        .withFailureHandler(err => { 
            clearTimeout(safetyTimer);
            if (err.message.includes("COLLISION_DETECTED")) {
                alert("SAVE FAILED: This project was modified by someone else while you were editing. Please close this window, refresh the main dashboard, and re-apply your changes.");
            } else {
                alert("Database Error: " + err.message); 
            }
            btn.disabled = false; 
            btn.innerText = "SAVE & SYNC CALENDAR"; 
        })
        .withSuccessHandler(res => { 
            clearTimeout(safetyTimer);
            btn.disabled = false; 

            if (res && res.toString().startsWith("Error")) {
                alert(res);
                btn.innerText = "SAVE & SYNC CALENDAR";
                return;
            }

            btn.innerText = "SAVED";
            window.isProjectDirty = false;
            setTimeout(() => { btn.innerText = "SAVE & SYNC CALENDAR"; }, 2000);
            
            let resObj = { id: res };
            try { if (typeof res === 'string' && res.startsWith('{')) resObj = JSON.parse(res); } catch(e){}
            
            let finalId = resObj.id || res;

            if (finalId && finalId !== "Success") {
                if (id === 'NEW') document.getElementById('edit-folder-id').value = finalId;

                google.script.run
                    .withFailureHandler(err => {
                        console.error("Folder generation failed:", err);
                        alert("Project saved, but Drive folder sync failed: " + err.message);
                    })
                    .withSuccessHandler(folderUrl => {
                        if (folderUrl && typeof refreshData === 'function') refreshData();
                    })
                    .generateProjectFolders(ACTIVE_USER_NAME, finalId, newT, timelines);

                if (id === 'NEW' && typeof startPresencePing === 'function') startPresencePing(finalId);
                if (id === 'NEW' && typeof window.openOrJoinDalCampaignRoom_ === 'function') {
                    try { window.openOrJoinDalCampaignRoom_(finalId); } catch (eJoin) { /* ignore */ }
                }
            }
            
            if (resObj.timestamp) {
                document.getElementById('edit-proj-version').value = resObj.timestamp;
            }

            refreshData();
            if (typeof window.peSyncSaveBtnChrome_ === 'function') window.peSyncSaveBtnChrome_();
            
        }).saveEventFromUI(projectData, timelines, ACTIVE_USER_NAME); 
}

function runSetStatus(status) {
  if (typeof canManageProjectLifecycle === 'function' && !canManageProjectLifecycle()) {
    return alert('🛑 Permission Denied: Only managers can change project status.');
  }
  const id = document.getElementById('edit-folder-id').value;
  
  if(document.getElementById('trash-dropdown')) document.getElementById('trash-dropdown').style.display = 'none';
  if(document.getElementById('status-dropdown')) document.getElementById('status-dropdown').style.display = 'none';
  
  if (!id || id === 'NEW') {
     document.getElementById('display-event-status').innerText = status.toUpperCase();
     return;
  }
  
  if (status === 'Trashed' || status === 'Cancelled') {
      if (!confirm(`Are you sure you want to mark this project as ${status}?`)) return;
  }
  
  document.getElementById('display-event-status').innerText = status.toUpperCase();
  window.isProjectDirty = true;
  
  google.script.run
      .withFailureHandler(err => alert("Failed to update status: " + err.message))
      .withSuccessHandler(() => {
         if (status === 'Trashed') { 
             window.activeProjectContext = null;
             closeModals(); 
             let isList = document.getElementById('desktop-event-list') && document.getElementById('desktop-event-list').style.display === 'flex';
             if (typeof setDashboardIcon === 'function') setDashboardIcon(isList ? 'list' : 'calendar');
             refreshData(); 
         } else { 
             refreshData(); 
         }
      }).setProjectStatus(id, status, ACTIVE_USER_NAME);
}

function openUnscheduledModal(pId, title, fullTitle) {
    window.isProjectDirty = false;
    window.activeProjectContext = pId;
    if (typeof setDashboardIcon === 'function') setDashboardIcon('project');
    document.getElementById('edit-modal-overlay').style.display = 'flex';
    document.getElementById('edit-folder-id').value = pId; 
    document.getElementById('edit-proj-version').value = ''; 
    document.getElementById('edit-proj-name').value = title; 
    document.getElementById('edit-orig-title').innerText = "Project: " + fullTitle;
    if(document.getElementById('trash-dropdown')) document.getElementById('trash-dropdown').style.display = 'none';
    if(document.getElementById('status-dropdown')) document.getElementById('status-dropdown').style.display = 'none';
    if(document.getElementById('type-dropdown')) document.getElementById('type-dropdown').style.display = 'none';
    
    let isOutdoor = false;
    if (typeof calendar !== 'undefined' && calendar) {
        let ev = calendar.getEventById(pId);
        if (ev && ev.extendedProps && ev.extendedProps.rawDbData && ev.extendedProps.rawDbData.readinessState) {
            window.currentReadinessState = ev.extendedProps.rawDbData.readinessState;
            let cState = window.currentReadinessState;
            if (cState.isOutdoor) isOutdoor = true;
            if (cState.coords) { document.getElementById('edit-proj-lat').value = cState.coords.lat; document.getElementById('edit-proj-lng').value = cState.coords.lng; }
        }
    }
    document.getElementById('edit-proj-outdoor').checked = isOutdoor;
    if (window.updateLiveWeatherWidget) window.updateLiveWeatherWidget();
    
    let cState = window.currentReadinessState || {};
    document.getElementById('edit-proj-in-sofia').checked = cState.inSofia !== false;
    document.getElementById('edit-proj-distance').value = cState.distanceKm || "";
    const zoneEl = document.getElementById('edit-proj-region-zone');
    if (zoneEl) zoneEl.value = cState.regionZone || (cState.inSofia !== false ? 'sofia' : 'outside_sofia');
    if(typeof window.toggleDistanceInput === 'function') window.toggleDistanceInput();
    
    document.getElementById('display-event-status').innerText = 'DRAFT';
    document.getElementById('edit-proj-type').value = 'Event';
    document.getElementById('display-event-type').innerText = 'EVENT';
    if(document.getElementById('edit-proj-client')) document.getElementById('edit-proj-client').value = '';
    if(document.getElementById('edit-proj-location')) document.getElementById('edit-proj-location').value = '';
    
    document.getElementById('restore-project-btn').style.display = 'block';
    
    let todayStr = new Date().toISOString().split('T')[0];
    bootMiniCalendar(todayStr, pId);
    if (typeof startPresencePing === 'function') startPresencePing(pId);
    if (typeof fetchEntitySummary === 'function') fetchEntitySummary(pId, 'project-history-btn');
    if (typeof window.peSyncSaveBtnChrome_ === 'function') window.peSyncSaveBtnChrome_();
}

window.cancelProjectEditor = function() {
    var canAuto = typeof window.peCanIdentityAutosave_ === 'function' && window.peCanIdentityAutosave_();
    var needsFlush = !!(window.isProjectDirty || window.peWarmAutosavePending_ || window.peWarmAutosaveBusy_);
    if (canAuto && needsFlush && typeof window.peQuietFlushIdentityForNav_ === 'function') {
      window.peQuietFlushIdentityForNav_();
    } else if (window.isProjectDirty) {
        // NEW create (or briefing) — still warn before discarding.
        if (!confirm("⚠️ You have unsaved event changes. Are you sure you want to discard them and leave?")) {
            return false;
        }
    }
    window.isProjectDirty = false;
    window.activeProjectContext = null;

    // Close Project Assets shell before clearing presence/warm chrome (avoid stuck SYNC freeze).
    try {
      var paOv = document.getElementById('project-assets-modal-overlay');
      if (paOv && paOv.style.display === 'flex') {
        if (typeof window.dalSoftLeavePrepKeepRoom_ === 'function') {
          var softPid = (typeof window.dalPresenceProjectId_ === 'function' && window.dalPresenceProjectId_()) ||
            (document.getElementById('edit-folder-id') ? document.getElementById('edit-folder-id').value : '');
          if (softPid && softPid !== 'NEW') window.dalSoftLeavePrepKeepRoom_(softPid);
        }
        paOv.style.display = 'none';
        paOv.style.cursor = '';
      }
    } catch (ePa) { /* ignore */ }
    
    document.getElementById('edit-folder-id').value = '';
    document.getElementById('edit-proj-version').value = '';
    if (typeof stopPresencePing === 'function') stopPresencePing();
    window.activePresenceModule = 'main';
    
    document.getElementById('edit-modal-overlay').style.display = 'none';
    document.getElementById('edit-modal-overlay').classList.remove('editor-briefing-mode');
    window.projectEditorBriefing = false;
    
    if (typeof setDashboardIcon === 'function') {
        let isList = document.getElementById('desktop-event-list') && document.getElementById('desktop-event-list').style.display === 'flex';
        setDashboardIcon(isList ? 'list' : 'calendar');
    }
    return true;
};

function closeModals() { 
    if (window.currentOperationType) {
        alert("⚠️ Please PAUSE the active operation before navigating away.");
        return false;
    }

    document.querySelectorAll('.modal-overlay').forEach(m => { 
        if (m.id !== 'backup-modal-overlay' && m.id !== 'task-modal-overlay' && m.id !== 'task-crew-modal-overlay') {
            m.style.display='none'; 
        }
    }); 
    
    ['shift-layer', 'master-settings-overlay', 'manager-settings-overlay', 'month-roster-layer', 'availability-modal-overlay', 'audit-studio-overlay', 'crew-manager-modal', 'financials-hub-overlay'].forEach(id => {
        let el = document.getElementById(id);
        if (el) {
            el.style.display = 'none';
        }
    });
    
    if (typeof updateActiveNav === 'function') updateActiveNav('nav-btn-dashboard');
    
    return true;
}

function sendManualCrewEmailUI() {
  const folderId = document.getElementById('edit-folder-id').value;
  const title = document.getElementById('edit-orig-title').innerText.replace("Project: ", "");
  const startDate = document.getElementById('edit-proj-date').value;
  const endDate = document.getElementById('edit-proj-end-date').value;
  const whDate = document.getElementById('edit-proj-wh-date').value;
  const wh2Date = document.getElementById('edit-proj-wh2-date').value;
  const tidyDate = document.getElementById('edit-proj-recovery-date').value;

  if(!folderId) return alert("Please save the project first.");
  
  const btn = document.getElementById('manual-crew-email-btn');
  const origText = btn.innerText;
  btn.innerText = "SENDING...";
  btn.disabled = true;

  google.script.run
      .withFailureHandler(err => {
          btn.innerText = "ERROR";
          alert(err.message);
          setTimeout(() => { btn.innerText = origText; btn.disabled = false; }, 2000);
      })
      .withSuccessHandler(res => {
          if(res === "Success") {
              btn.innerText = "SENT";
          } else {
              btn.innerText = "ERROR";
              alert(res);
          }
          setTimeout(() => { btn.innerText = origText; btn.disabled = false; }, 2000);
      }).triggerManualCrewEmail(folderId, title, startDate, endDate, whDate, wh2Date, tidyDate, ACTIVE_USER_NAME);
}
</script>
